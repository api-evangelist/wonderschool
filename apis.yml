name: Wonderschool
description: >-
  Wonderschool is a child care platform that connects families with licensed
  care and equips providers with software and services to start, operate, and
  grow their child care programs. It also serves government agencies with
  licensing, subsidy management, enrollment coordination, and statewide
  substitute-teacher pools, and offers employers child care benefit programs.
  Backed by a16z and Uncork Capital, Wonderschool operates as a B2B/B2G SaaS
  business; it publishes a Vanta-hosted trust center (SOC 2 Type II, NIST CSF)
  but no public developer API, SDKs, or webhooks were found during enrichment.
